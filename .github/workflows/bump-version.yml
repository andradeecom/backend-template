name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump package.json version
        id: bump
        run: |
          pnpm version ${{ inputs.bump }} --no-git-tag-version
          NEW_VERSION="v$(node -p "require('./package.json').version")"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      # The version is served by GET /api/docs, so Swagger would otherwise keep
      # advertising whatever release the string was hardcoded at.
      - name: Sync version to Swagger config
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          BARE="${VERSION#v}"
          node -e "
            const fs = require('fs');
            const path = 'src/main.ts';
            const source = fs.readFileSync(path, 'utf8');
            const updated = source.replace(
              /\.setVersion\('[^']*'\)/,
              \".setVersion('${BARE}')\"
            );
            if (updated === source) {
              throw new Error('setVersion() call not found in ' + path);
            }
            fs.writeFileSync(path, updated);
          "

      - name: Commit, tag and push
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          git add package.json src/main.ts
          git commit -m "chore: bump version to ${VERSION}"
          git tag "${VERSION}"
          git push origin HEAD --tags
